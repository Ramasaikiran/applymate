name: Deploy to Supabase

# Runs whenever a push to main touches migrations or edge functions --
# so a merged PR/commit actually reaches the live database and
# functions, instead of sitting in the repo until someone remembers
# to deploy it by hand.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # razorpay-webhook is called directly by Razorpay's servers using
      # its own x-razorpay-signature header, not a Supabase JWT -- so
      # it needs JWT verification off, or Supabase's platform would
      # reject the request before our own signature check ever runs.
      - name: Deploy razorpay-webhook (no JWT check -- called by Razorpay directly)
        run: supabase functions deploy razorpay-webhook --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Everything else is called from the frontend via supabase-js,
      # which attaches the anon key automatically -- default JWT
      # verification stays on for these.
      - name: Deploy remaining functions
        run: |
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ "$name" != "razorpay-webhook" ] && [ "$name" != "_shared" ]; then
              echo "Deploying $name..."
              supabase functions deploy "$name"
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
